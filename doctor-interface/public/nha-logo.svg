<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" fill="none">
  <!-- Ashoka Lion Capital Emblem (Official Stylized Silhouette) -->
  <g transform="translate(10, 4) scale(0.65)" fill="#1f2937">
    <!-- Base Pedestal -->
    <rect x="18" y="78" width="48" height="4" rx="1"/>
    <rect x="22" y="74" width="40" height="3" rx="1"/>
    <!-- Dharma Chakra in Center -->
    <circle cx="42" cy="65" r="7" stroke="#1f2937" stroke-width="2" fill="none"/>
    <circle cx="42" cy="65" r="2" fill="#1f2937"/>
    <!-- Horse (left) and Bull (right) silhouettes -->
    <ellipse cx="26" cy="66" rx="4" ry="2"/>
    <ellipse cx="58" cy="66" rx="4" ry="2"/>
    <rect x="16" y="70" width="52" height="2"/>
    <!-- Abacus Bell Lotus Base -->
    <path d="M22 60 C 22 55, 62 55, 62 60 Z"/>
    
    <!-- Central Lion -->
    <path d="M36 28 C 36 22, 42 16, 42 16 C 42 16, 48 22, 48 28 C 50 32, 51 38, 48 44 C 47 47, 47 54, 47 56 L 37 56 C 37 54, 37 47, 36 44 C 33 38, 34 32, 36 28 Z"/>
    <!-- Left Lion Profile -->
    <path d="M37 26 C 34 22, 26 22, 23 26 C 20 29, 21 36, 25 40 C 26 42, 28 45, 29 55 L 36 55 C 34 46, 33 40, 37 36 Z"/>
    <!-- Right Lion Profile -->
    <path d="M47 26 C 50 22, 58 22, 61 26 C 64 29, 63 36, 59 40 C 58 42, 56 45, 55 55 L 48 55 C 50 46, 51 40, 47 36 Z"/>
    
    <!-- Mane details -->
    <path d="M38 32 C 40 34, 44 34, 46 32 C 45 36, 39 36, 38 32 Z"/>
    <path d="M39 38 C 41 40, 43 40, 45 38 C 44 42, 40 42, 39 38 Z"/>
    <path d="M40 44 C 41 46, 43 46, 44 44 C 43 48, 41 48, 40 44 Z"/>
    
    <!-- Satyameva Jayate (सत्यमेव जयते) Representation line -->
    <rect x="24" y="84" width="36" height="1.5" rx="0.5" fill="#4b5563"/>
  </g>

  <!-- Typography: national health authority -->
  <text x="68" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#111827" letter-spacing="-0.5">national</text>
  <text x="68" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#111827" letter-spacing="-0.5">health</text>
  <text x="68" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#111827" letter-spacing="-0.5">authority</text>
</svg>
