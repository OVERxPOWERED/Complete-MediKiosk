<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" style="background:#fff;font-family:system-ui,sans-serif;">
  <rect x="20" y="20" width="760" height="1060" fill="#fff" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <g transform="translate(40, 45)">
    <circle cx="24" cy="24" r="22" fill="#065f46"/>
    <path d="M16 24h16M24 16v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="56" y="22" font-size="20" font-weight="bold" fill="#0f172a">City Care Diagnostics &amp; Research Center</text>
    <text x="56" y="38" font-size="12" fill="#64748b">Precordial Chest Leads V1 - V6 · Page 2 of 2</text>
    <text x="580" y="22" font-size="16" font-weight="bold" fill="#dc2626">PRECORDIAL LEADS</text>
  </g>
  <line x1="40" y1="95" x2="760" y2="95" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Precordial grid -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="720" height="800" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
    <defs>
      <pattern id="ecg-small-2" width="10" height="10" patternUnits="userSpaceOnUse">
        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#fed7d7" stroke-width="0.5"/>
      </pattern>
      <pattern id="ecg-large-2" width="50" height="50" patternUnits="userSpaceOnUse">
        <rect width="50" height="50" fill="url(#ecg-small-2)"/>
        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#fca5a5" stroke-width="1.2"/>
      </pattern>
    </defs>
    <rect width="720" height="800" fill="url(#ecg-large-2)"/>

    <!-- V1 & V4 -->
    <text x="20" y="30" font-size="14" font-weight="bold" fill="#991b1b">LEAD V1 (4th Intercostal Right Sternal Border)</text>
    <path d="M 20 80 h 30 l 4 -40 l 4 30 h 10 l 12 -12 l 12 12 h 40 l 4 -40 l 4 30 h 10 l 12 -12 l 12 12 h 40 l 4 -40 l 4 30 h 10 l 12 -12 l 12 12 h 40" fill="none" stroke="#0f172a" stroke-width="1.8"/>

    <text x="370" y="30" font-size="14" font-weight="bold" fill="#991b1b">LEAD V4 (5th Intercostal Midclavicular)</text>
    <path d="M 370 80 h 25 l 4 10 l 6 -70 l 6 85 l 4 -25 h 12 l 12 18 h 40 l 4 10 l 6 -70 l 6 85 l 4 -25 h 12 l 12 18 h 40" fill="none" stroke="#0f172a" stroke-width="1.8"/>

    <!-- V2 & V5 -->
    <text x="20" y="180" font-size="14" font-weight="bold" fill="#991b1b">LEAD V2 (4th Intercostal Left Sternal Border)</text>
    <path d="M 20 230 h 25 l 4 8 l 6 -60 l 6 75 l 4 -23 h 12 l 14 16 h 40 l 4 8 l 6 -60 l 6 75 l 4 -23 h 12 l 14 16 h 40" fill="none" stroke="#0f172a" stroke-width="1.8"/>

    <text x="370" y="180" font-size="14" font-weight="bold" fill="#991b1b">LEAD V5 (Anterior Axillary Line)</text>
    <path d="M 370 230 h 25 l 4 10 l 6 -75 l 6 90 l 4 -25 h 12 l 14 18 h 40 l 4 10 l 6 -75 l 6 90 l 4 -25 h 12 l 14 18 h 40" fill="none" stroke="#0f172a" stroke-width="1.8"/>

    <!-- V3 & V6 -->
    <text x="20" y="330" font-size="14" font-weight="bold" fill="#991b1b">LEAD V3 (Equidistant between V2 and V4)</text>
    <path d="M 20 380 h 25 l 4 10 l 6 -70 l 6 85 l 4 -25 h 12 l 14 18 h 40 l 4 10 l 6 -70 l 6 85 l 4 -25 h 12 l 14 18 h 40" fill="none" stroke="#0f172a" stroke-width="1.8"/>

    <text x="370" y="330" font-size="14" font-weight="bold" fill="#991b1b">LEAD V6 (Midaxillary Line)</text>
    <path d="M 370 380 h 25 l 4 8 l 6 -60 l 6 75 l 4 -23 h 12 l 14 16 h 40 l 4 8 l 6 -60 l 6 75 l 4 -23 h 12 l 14 16 h 40" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(40, 950)">
    <rect x="0" y="0" width="720" height="90" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
    <text x="20" y="35" font-size="13" font-weight="bold" fill="#0f172a">Precordial R-wave Progression: Normal progression observed V1 through V6.</text>
    <text x="20" y="60" font-size="12" fill="#64748b">Verified electronically by Dr. S. Kulkarni MD (Cardiology) · Digitized at MediKiosk Intake Kiosk</text>
  </g>
</svg>
