<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" style="background:#fff;font-family:system-ui,sans-serif;">
  <rect x="20" y="20" width="760" height="1060" fill="#fff" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#0f766e"/>
    <text x="14" y="32" font-size="24" font-weight="bold" fill="#fff">L</text>
    <text x="60" y="24" font-size="20" font-weight="bold" fill="#0f172a">Apex Diagnostic Pathology Laboratory</text>
    <text x="60" y="42" font-size="12" fill="#64748b">Page 2 of 3 · Kidney &amp; Liver Function Tests</text>
    <text x="560" y="24" font-size="16" font-weight="bold" fill="#0f766e">BIOCHEMISTRY</text>
    <text x="560" y="42" font-size="11" fill="#64748b">Rohit Mehta (36/M)</text>
  </g>
  <line x1="40" y1="105" x2="760" y2="105" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Table -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="720" height="35" fill="#f1f5f9"/>
    <text x="20" y="22" font-size="12" font-weight="bold" fill="#334155">TEST PARAMETER</text>
    <text x="280" y="22" font-size="12" font-weight="bold" fill="#334155">RESULT</text>
    <text x="420" y="22" font-size="12" font-weight="bold" fill="#334155">UNIT</text>
    <text x="560" y="22" font-size="12" font-weight="bold" fill="#334155">REFERENCE RANGE</text>

    <!-- Renal Function -->
    <rect x="0" y="45" width="720" height="28" fill="#f8fafc"/>
    <text x="20" y="64" font-size="12" font-weight="bold" fill="#0f766e">RENAL / KIDNEY FUNCTION PANEL (RFT/KFT)</text>

    <text x="20" y="105" font-size="13" fill="#0f172a">Blood Urea</text>
    <text x="280" y="105" font-size="13" font-weight="bold" fill="#0f172a">24.6</text>
    <text x="420" y="105" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="105" font-size="13" fill="#64748b">15 - 45</text>
    <line x1="0" y1="120" x2="720" y2="120" stroke="#f1f5f9"/>

    <text x="20" y="145" font-size="13" fill="#0f172a">Serum Creatinine</text>
    <text x="280" y="145" font-size="13" font-weight="bold" fill="#0f172a">0.92</text>
    <text x="420" y="145" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="145" font-size="13" fill="#64748b">0.7 - 1.3</text>
    <line x1="0" y1="160" x2="720" y2="160" stroke="#f1f5f9"/>

    <text x="20" y="185" font-size="13" fill="#0f172a">Serum Uric Acid</text>
    <text x="280" y="185" font-size="13" font-weight="bold" fill="#0f172a">5.4</text>
    <text x="420" y="185" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="185" font-size="13" fill="#64748b">3.5 - 7.2</text>
    <line x1="0" y1="200" x2="720" y2="200" stroke="#f1f5f9"/>

    <text x="20" y="225" font-size="13" fill="#0f172a">Sodium (Na+)</text>
    <text x="280" y="225" font-size="13" font-weight="bold" fill="#0f172a">139</text>
    <text x="420" y="225" font-size="13" fill="#64748b">mEq/L</text>
    <text x="560" y="225" font-size="13" fill="#64748b">135 - 145</text>
    <line x1="0" y1="240" x2="720" y2="240" stroke="#f1f5f9"/>

    <text x="20" y="265" font-size="13" fill="#0f172a">Potassium (K+)</text>
    <text x="280" y="265" font-size="13" font-weight="bold" fill="#0f172a">4.2</text>
    <text x="420" y="265" font-size="13" fill="#64748b">mEq/L</text>
    <text x="560" y="265" font-size="13" fill="#64748b">3.5 - 5.1</text>
    <line x1="0" y1="280" x2="720" y2="280" stroke="#f1f5f9"/>

    <!-- Liver Function -->
    <rect x="0" y="300" width="720" height="28" fill="#f8fafc"/>
    <text x="20" y="319" font-size="12" font-weight="bold" fill="#0f766e">LIVER FUNCTION PANEL (LFT)</text>

    <text x="20" y="355" font-size="13" fill="#0f172a">Bilirubin (Total)</text>
    <text x="280" y="355" font-size="13" fill="#0f172a">0.8</text>
    <text x="420" y="355" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="355" font-size="13" fill="#64748b">0.2 - 1.2</text>
    <line x1="0" y1="370" x2="720" y2="370" stroke="#f1f5f9"/>

    <text x="20" y="395" font-size="13" fill="#0f172a">SGOT (AST)</text>
    <text x="280" y="395" font-size="13" fill="#0f172a">26</text>
    <text x="420" y="395" font-size="13" fill="#64748b">U/L</text>
    <text x="560" y="395" font-size="13" fill="#64748b">10 - 40</text>
    <line x1="0" y1="410" x2="720" y2="410" stroke="#f1f5f9"/>

    <text x="20" y="435" font-size="13" fill="#0f172a">SGPT (ALT)</text>
    <text x="280" y="435" font-size="13" fill="#0f172a">29</text>
    <text x="420" y="435" font-size="13" fill="#64748b">U/L</text>
    <text x="560" y="435" font-size="13" fill="#64748b">10 - 45</text>
  </g>

  <g transform="translate(40, 920)">
    <line x1="0" y1="0" x2="720" y2="0" stroke="#cbd5e1"/>
    <text x="20" y="35" font-size="12" font-weight="bold" fill="#0f766e">Interpretation: Renal and Hepatic profiles are within normal reference ranges.</text>
  </g>
</svg>
