<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" style="background:#fff;font-family:system-ui,sans-serif;">
  <!-- Border & Header -->
  <rect x="20" y="20" width="760" height="1060" fill="#fff" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  
  <!-- Header Banner -->
  <g transform="translate(40, 45)">
    <circle cx="24" cy="24" r="22" fill="#065f46"/>
    <path d="M16 24h16M24 16v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="56" y="22" font-size="20" font-weight="bold" fill="#0f172a">City Care Diagnostics &amp; Research Center</text>
    <text x="56" y="38" font-size="12" fill="#64748b">Trusted Diagnostics. Healthier Tomorrow. · ISO 9001:2015 &amp; NABL Accredited</text>
    <text x="580" y="22" font-size="16" font-weight="bold" fill="#dc2626">12-LEAD ECG REPORT</text>
    <text x="580" y="38" font-size="11" fill="#64748b">Ref No: ECG-2026-90812</text>
  </g>
  <line x1="40" y1="95" x2="760" y2="95" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Patient Details Box -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="720" height="85" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
    <text x="15" y="24" font-size="12" font-weight="bold" fill="#475569">Patient Name:</text>
    <text x="105" y="24" font-size="12" font-weight="bold" fill="#0f172a">Mr. Rohit Mehta</text>
    
    <text x="15" y="46" font-size="12" font-weight="bold" fill="#475569">Age / Gender:</text>
    <text x="105" y="46" font-size="12" fill="#0f172a">36 Yrs / Male</text>

    <text x="15" y="68" font-size="12" font-weight="bold" fill="#475569">UHID / ABHA:</text>
    <text x="105" y="68" font-size="12" fill="#0f172a">UHID778901 / ABHA832017665432</text>

    <text x="320" y="24" font-size="12" font-weight="bold" fill="#475569">Recorded Date:</text>
    <text x="415" y="24" font-size="12" fill="#0f172a">03 Sep 2026 · 09:08 AM</text>

    <text x="320" y="46" font-size="12" font-weight="bold" fill="#475569">Heart Rate:</text>
    <text x="415" y="46" font-size="12" font-weight="bold" fill="#065f46">84 bpm (Sinus Rhythm)</text>

    <text x="320" y="68" font-size="12" font-weight="bold" fill="#475569">PR / QRS Int:</text>
    <text x="415" y="68" font-size="12" fill="#0f172a">160 ms / 92 ms (Normal)</text>

    <text x="560" y="24" font-size="12" font-weight="bold" fill="#475569">QT / QTc:</text>
    <text x="630" y="24" font-size="12" fill="#0f172a">360 / 412 ms</text>

    <text x="560" y="46" font-size="12" font-weight="bold" fill="#475569">P-R-T Axis:</text>
    <text x="630" y="46" font-size="12" fill="#0f172a">48° / 62° / 38°</text>

    <text x="560" y="68" font-size="12" font-weight="bold" fill="#475569">Referred By:</text>
    <text x="630" y="68" font-size="12" fill="#065f46">Self / OPD Desk 4</text>
  </g>

  <!-- ECG Grid Background (Pink millimeter paper) -->
  <g transform="translate(40, 215)">
    <!-- Paper background -->
    <rect x="0" y="0" width="720" height="660" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5"/>
    
    <!-- Major Grid Lines 5mm -->
    <defs>
      <pattern id="ecg-small" width="10" height="10" patternUnits="userSpaceOnUse">
        <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#fed7d7" stroke-width="0.5"/>
      </pattern>
      <pattern id="ecg-large" width="50" height="50" patternUnits="userSpaceOnUse">
        <rect width="50" height="50" fill="url(#ecg-small)"/>
        <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#fca5a5" stroke-width="1.2"/>
      </pattern>
    </defs>
    <rect width="720" height="660" fill="url(#ecg-large)"/>

    <!-- Lead I -->
    <text x="15" y="25" font-size="13" font-weight="bold" fill="#7f1d1d">LEAD I (25mm/s, 10mm/mV)</text>
    <path d="M 15 70 h 30 l 5 -5 l 5 5 h 15 l 4 8 l 6 -55 l 6 75 l 4 -28 h 10 l 12 -15 l 12 15 h 30 l 5 -5 l 5 5 h 15 l 4 8 l 6 -55 l 6 75 l 4 -28 h 10 l 12 -15 l 12 15 h 30 l 5 -5 l 5 5 h 15 l 4 8 l 6 -55 l 6 75 l 4 -28 h 10 l 12 -15 l 12 15 h 30" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Lead II -->
    <text x="365" y="25" font-size="13" font-weight="bold" fill="#7f1d1d">LEAD aVR</text>
    <path d="M 365 70 h 30 l 5 5 l 5 -5 h 15 l 4 -8 l 6 55 l 6 -75 l 4 28 h 10 l 12 15 l 12 -15 h 30 l 5 5 l 5 -5 h 15 l 4 -8 l 6 55 l 6 -75 l 4 28 h 10 l 12 15 l 12 -15 h 30" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Lead III -->
    <text x="15" y="165" font-size="13" font-weight="bold" fill="#7f1d1d">LEAD II</text>
    <path d="M 15 210 h 25 l 6 -8 l 6 8 h 12 l 4 10 l 6 -65 l 6 85 l 4 -30 h 12 l 14 -18 l 14 18 h 25 l 6 -8 l 6 8 h 12 l 4 10 l 6 -65 l 6 85 l 4 -30 h 12 l 14 -18 l 14 18 h 25" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Lead aVL -->
    <text x="365" y="165" font-size="13" font-weight="bold" fill="#7f1d1d">LEAD aVL</text>
    <path d="M 365 210 h 25 l 6 -6 l 6 6 h 12 l 4 6 l 6 -45 l 6 60 l 4 -21 h 12 l 14 -12 l 14 12 h 25 l 6 -6 l 6 6 h 12 l 4 6 l 6 -45 l 6 60 l 4 -21 h 12 l 14 -12 l 14 12 h 25" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Lead aVF -->
    <text x="15" y="305" font-size="13" font-weight="bold" fill="#7f1d1d">LEAD III</text>
    <path d="M 15 350 h 25 l 6 -6 l 6 6 h 12 l 4 6 l 6 -40 l 6 52 l 4 -18 h 12 l 14 -10 l 14 10 h 25 l 6 -6 l 6 6 h 12 l 4 6 l 6 -40 l 6 52 l 4 -18 h 12 l 14 -10 l 14 10 h 25" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Lead aVF -->
    <text x="365" y="305" font-size="13" font-weight="bold" fill="#7f1d1d">LEAD aVF</text>
    <path d="M 365 350 h 25 l 6 -7 l 6 7 h 12 l 4 8 l 6 -52 l 6 68 l 4 -24 h 12 l 14 -14 l 14 14 h 25 l 6 -7 l 6 7 h 12 l 4 8 l 6 -52 l 6 68 l 4 -24 h 12 l 14 -14 l 14 14 h 25" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Continuous Lead II Rhythm Strip at Bottom -->
    <line x1="0" y1="440" x2="720" y2="440" stroke="#f87171" stroke-width="1.2"/>
    <text x="15" y="465" font-size="13" font-weight="bold" fill="#7f1d1d">LEAD II (Continuous Rhythm Strip - 10 sec)</text>
    <path d="M 15 540 h 20 l 5 -7 l 5 7 h 10 l 4 10 l 6 -65 l 6 85 l 4 -30 h 10 l 14 -18 l 14 18 h 35 l 5 -7 l 5 7 h 10 l 4 10 l 6 -65 l 6 85 l 4 -30 h 10 l 14 -18 l 14 18 h 35 l 5 -7 l 5 7 h 10 l 4 10 l 6 -65 l 6 85 l 4 -30 h 10 l 14 -18 l 14 18 h 35 l 5 -7 l 5 7 h 10 l 4 10 l 6 -65 l 6 85 l 4 -30 h 10 l 14 -18 l 14 18 h 35 l 5 -7 l 5 7 h 10 l 4 10 l 6 -65 l 6 85 l 4 -30 h 10 l 14 -18 l 14 18 h 35" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Clinical Impression & Sign-off Box -->
  <g transform="translate(40, 900)">
    <rect x="0" y="0" width="720" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
    <text x="20" y="28" font-size="14" font-weight="bold" fill="#0f172a">CLINICAL IMPRESSION &amp; INTERPRETATION:</text>
    <text x="20" y="52" font-size="13" fill="#334155">1. Normal Sinus Rhythm with heart rate of 84 beats per minute.</text>
    <text x="20" y="72" font-size="13" fill="#334155">2. Normal PR interval and QRS duration. Normal electrical axis (62°).</text>
    <text x="20" y="92" font-size="13" fill="#334155">3. No acute ST segment elevation, depression or pathological Q-waves observed.</text>
    <text x="20" y="112" font-size="13" font-weight="bold" fill="#065f46">Conclusion: Normal Baseline 12-Lead Electrocardiogram. Correlate clinically.</text>

    <!-- Signature -->
    <g transform="translate(520, 30)">
      <path d="M 10 50 Q 30 10 60 40 T 110 30 T 150 50" fill="none" stroke="#0369a1" stroke-width="2"/>
      <text x="35" y="80" font-size="12" font-weight="bold" fill="#0f172a">Dr. S. Kulkarni</text>
      <text x="15" y="96" font-size="10" fill="#64748b">MD, DM (Cardiology), FACC</text>
      <text x="25" y="110" font-size="10" fill="#64748b">Reg. No: MP/23456</text>
    </g>
  </g>
</svg>
