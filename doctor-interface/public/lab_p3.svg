<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" style="background:#fff;font-family:system-ui,sans-serif;">
  <rect x="20" y="20" width="760" height="1060" fill="#fff" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#0f766e"/>
    <text x="14" y="32" font-size="24" font-weight="bold" fill="#fff">L</text>
    <text x="60" y="24" font-size="20" font-weight="bold" fill="#0f172a">Apex Diagnostic Pathology Laboratory</text>
    <text x="60" y="42" font-size="12" fill="#64748b">Page 3 of 3 · Fasting Lipid Profile Panel</text>
    <text x="560" y="24" font-size="16" font-weight="bold" fill="#d97706">LIPID PROFILE</text>
  </g>
  <line x1="40" y1="105" x2="760" y2="105" stroke="#cbd5e1" stroke-width="1.5"/>

  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="720" height="35" fill="#f1f5f9"/>
    <text x="20" y="22" font-size="12" font-weight="bold" fill="#334155">TEST PARAMETER</text>
    <text x="280" y="22" font-size="12" font-weight="bold" fill="#334155">RESULT</text>
    <text x="420" y="22" font-size="12" font-weight="bold" fill="#334155">UNIT</text>
    <text x="560" y="22" font-size="12" font-weight="bold" fill="#334155">REFERENCE RANGE</text>

    <text x="20" y="65" font-size="13" fill="#0f172a">Total Cholesterol</text>
    <text x="280" y="65" font-size="13" font-weight="bold" fill="#d97706">218 (High)</text>
    <text x="420" y="65" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="65" font-size="13" fill="#64748b">&lt; 200 Desirable</text>
    <line x1="0" y1="80" x2="720" y2="80" stroke="#f1f5f9"/>

    <text x="20" y="105" font-size="13" fill="#0f172a">Triglycerides</text>
    <text x="280" y="105" font-size="13" font-weight="bold" fill="#d97706">182 (Borderline)</text>
    <text x="420" y="105" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="105" font-size="13" fill="#64748b">&lt; 150 Normal</text>
    <line x1="0" y1="120" x2="720" y2="120" stroke="#f1f5f9"/>

    <text x="20" y="145" font-size="13" fill="#0f172a">HDL Cholesterol (Good)</text>
    <text x="280" y="145" font-size="13" font-weight="bold" fill="#0f172a">42</text>
    <text x="420" y="145" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="145" font-size="13" fill="#64748b">&gt; 40 Optimal</text>
    <line x1="0" y1="160" x2="720" y2="160" stroke="#f1f5f9"/>

    <text x="20" y="185" font-size="13" fill="#0f172a">LDL Cholesterol (Bad)</text>
    <text x="280" y="185" font-size="13" font-weight="bold" fill="#d97706">139 (Borderline)</text>
    <text x="420" y="185" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="185" font-size="13" fill="#64748b">&lt; 100 Optimal</text>
    <line x1="0" y1="200" x2="720" y2="200" stroke="#f1f5f9"/>

    <text x="20" y="225" font-size="13" fill="#0f172a">VLDL Cholesterol</text>
    <text x="280" y="225" font-size="13" fill="#0f172a">36.4</text>
    <text x="420" y="225" font-size="13" fill="#64748b">mg/dL</text>
    <text x="560" y="225" font-size="13" fill="#64748b">5 - 30</text>
  </g>

  <g transform="translate(40, 920)">
    <line x1="0" y1="0" x2="720" y2="0" stroke="#cbd5e1"/>
    <text x="20" y="35" font-size="12" font-weight="bold" fill="#d97706">Impression: Mild Hypercholesterolemia. Dietary modification and cardiovascular risk control recommended.</text>
  </g>
</svg>
